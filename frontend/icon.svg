<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Pulse Ring -->
  <circle cx="256" cy="236" r="140" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="8" stroke-dasharray="12 12" />

  <!-- Microphone Icon -->
  <g filter="url(#glow)">
    <!-- Mic Body -->
    <rect x="216" y="140" width="80" height="150" rx="40" fill="url(#iconGrad)" />
    
    <!-- Mic Stand Arc -->
    <path d="M 166 230 A 90 90 0 0 0 346 230" fill="none" stroke="url(#iconGrad)" stroke-width="24" stroke-linecap="round" />
    
    <!-- Mic Stand Stem -->
    <line x1="256" y1="320" x2="256" y2="370" stroke="url(#iconGrad)" stroke-width="24" stroke-linecap="round" />
    
    <!-- Mic Stand Base -->
    <line x1="196" y1="370" x2="316" y2="370" stroke="url(#iconGrad)" stroke-width="24" stroke-linecap="round" />
  </g>

  <!-- Sound Waves -->
  <path d="M 120 236 Q 100 200 120 164" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.8" />
  <path d="M 392 236 Q 412 200 392 164" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.8" />
</svg>
